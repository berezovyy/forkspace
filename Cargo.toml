[package]
name = "forkspace"
version = "0.1.0"
edition = "2021"
description = "Copy-on-write copies of a project directory, including node_modules, .env and other ignored files. Changes stay in the copy until you merge them back. Linux and macOS, no root needed."
license = "MIT"
repository = "https://github.com/berezovyy/forkspace"
readme = "README.md"
keywords = ["workspace", "overlayfs", "copy-on-write", "git", "agents"]
categories = ["command-line-utilities", "development-tools", "filesystem"]
# The README's films and the docs stay on GitHub; the crate is the source and tests' fixtures.
include = ["/src", "/tests", "/Cargo.toml", "/Cargo.lock", "/README.md", "/LICENSE", "/CHANGELOG.md"]

[dependencies]
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
libc = "0.2"
walkdir = "2"
ignore = "0.4"
similar = "2"
owo-colors = "4"
time = { version = "0.3", features = ["formatting", "parsing"] }

[dev-dependencies]
serial_test = "3"
tempfile = "3"

[profile.release]
strip = true
