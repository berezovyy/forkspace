name: docs

on:
  # Automatic CI is temporarily paused. Run manually from the Actions tab.
  workflow_dispatch:

jobs:
  examples:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build
      - run: sh scripts/test-docs.sh
