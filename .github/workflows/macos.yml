name: macos

on:
  # Automatic CI is temporarily paused. Run manually from the Actions tab.
  workflow_dispatch:

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # Linux CI never compiles the macOS-only code, so lint it here.
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
