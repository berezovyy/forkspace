name: release

# scripts/release.sh creates each GitHub release with the Linux x86_64 binary, built on the
# maintainer's machine. This workflow adds the binaries that machine cannot build to the same
# release. Rerun it for a tag from the Actions tab if a build fails.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build, for example v0.2.0
        required: true

permissions:
  contents: write

jobs:
  binaries:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-apple-darwin, os: macos-latest }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm }
    runs-on: ${{ matrix.os }}
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      TARGET: ${{ matrix.target }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build
        run: cargo build --release --locked --target "$TARGET"
      - name: Check the version
        # The macOS runner is Apple Silicon; it cannot run the x86_64 build without Rosetta.
        if: matrix.target != 'x86_64-apple-darwin'
        run: test "$(target/$TARGET/release/forkspace --version)" = "forkspace ${TAG#v}"
      - name: Package
        run: |
          asset="forkspace-${TAG#v}-$TARGET.tar.gz"
          tar -czf "$asset" -C "target/$TARGET/release" forkspace -C "$GITHUB_WORKSPACE" LICENSE
          shasum -a 256 "$asset" > "$asset.sha256"
          echo "ASSET=$asset" >> "$GITHUB_ENV"
      - name: Upload to the release
        run: gh release upload "$TAG" "$ASSET" "$ASSET.sha256" --clobber
