name: ci

on:
  # Automatic CI is temporarily paused. Run manually from the Actions tab.
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --all-targets
      - run: cargo clippy --all-targets -- -D warnings
      - name: Test (mount cases use the real capability probe)
        run: cargo test
